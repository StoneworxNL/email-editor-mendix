name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npm test
              env:
                  CI: true
            - run: npm run build
            # Production package: lint (prerelease), minified build with
            # dependencies.txt, then the .mpk content check (postrelease).
            - run: npm run release
            - uses: actions/upload-artifact@v4
              with:
                  name: mpk
                  path: dist/*/*.mpk
                  if-no-files-found: error
