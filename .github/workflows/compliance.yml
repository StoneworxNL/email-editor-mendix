name: Compliance

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

env:
    GITLEAKS_VERSION: 8.30.1
    GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    LICENSE_CHECKER_VERSION: 5.0.1

jobs:
    secrets:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0
            - name: Install gitleaks
              run: |
                  curl -sSfLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
                  echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c
                  tar -xzf gitleaks.tar.gz gitleaks
                  rm gitleaks.tar.gz
            - name: Scan the full history
              run: ./gitleaks git . --no-banner --redact -v --log-opts="--all"

    licenses:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - name: Production dependencies use allowed licenses
              run: >-
                  npx --yes "license-checker-rseidelsohn@${LICENSE_CHECKER_VERSION}" --production
                  --excludePrivatePackages --excludePackagesStartingWith "@mendix/;reactemaileditor@" --onlyAllow
                  "MIT;MIT-0;ISC;BSD-2-Clause;BSD-3-Clause;0BSD;Apache-2.0;Python-2.0;CC0-1.0;BlueOak-1.0.0" --summary
